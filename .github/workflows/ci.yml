name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Eval gate (held-out golden slides)
        run: python evals/run_eval.py
      - name: MCP server imports cleanly
        run: |
          pip install -r requirements-mcp.txt
          python -c "import mcp_server; print('MCP server OK')"
